name: iOS CI

on:
  # iOS のファイルを変更したら、どのブランチでもビルドとテストを行う
  push:
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # .xcodeproj は git に入れず、project.yml から作る
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          # ランナーに入っているシミュレータから iPhone を1台選ぶ
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild -version
          # エラーはGitHubの画面に注釈（annotations）として表示する
          xcodebuild test \
            -project GPSLogger.xcodeproj \
            -scheme GPSLogger \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcbeautify --renderer github-actions || {
            # xcbeautify が拾えなかった場合に備えて、エラーの行も注釈にする
            grep -E "error:|Test Case .* failed|\*\* .* FAILED \*\*" build.log | sort -u | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
